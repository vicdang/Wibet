version: '3.8'

services:
  web:
    build: .
    container_name: wibet-php
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: yii2basic
      DB_NAME_STAGING: yii2basic_staging
      DB_USER: yii2user
      DB_PASSWORD: yii2password
    networks:
      - wibet-network

  db:
    image: mysql:8.0
    container_name: wibet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yii2basic
      MYSQL_USER: yii2user
      MYSQL_PASSWORD: yii2password
    volumes:
      - db-data:/var/lib/mysql
      - ./database/blank_db/blankdb_2024.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/docker/02-staging.sql:/docker-entrypoint-initdb.d/02-staging.sql
    ports:
      - "3306:3306"
    networks:
      - wibet-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: wibet-nginx
    ports:
      - "80:80"
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - wibet-network

volumes:
  db-data:

networks:
  wibet-network:
    driver: bridge
